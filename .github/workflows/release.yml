name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release -p spotless --target aarch64-apple-darwin
          cargo build --release -p spotless --target x86_64-apple-darwin

      - name: Make a universal binary
        # One download that runs on every Mac, rather than asking people which
        # chip they have.
        run: |
          mkdir -p dist
          lipo -create -output dist/spotless \
            target/aarch64-apple-darwin/release/spotless \
            target/x86_64-apple-darwin/release/spotless
          lipo -info dist/spotless
          dist/spotless --version

      # Signing is optional: a fork without the secrets still produces a working
      # release, it just ships an unsigned binary. `curl | tar` never applies a
      # quarantine flag, so an unsigned binary installed that way runs — but one
      # downloaded through a browser does not, and that is the case this fixes.
      - name: Sign
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" dist/spotless
          codesign --verify --strict --verbose=2 dist/spotless

      - name: Notarize
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # notarytool takes an archive, and a ticket cannot be stapled to a
          # bare Mach-O executable (only to a .app, .dmg or .pkg). The ticket is
          # published to Apple all the same, so Gatekeeper's online check passes.
          ditto -c -k --keepParent dist/spotless "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Package
        run: |
          cd dist
          tar -czf spotless-macos-universal.tar.gz spotless
          shasum -a 256 spotless-macos-universal.tar.gz > spotless-macos-universal.tar.gz.sha256
          cat spotless-macos-universal.tar.gz.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spotless-macos-universal.tar.gz
            dist/spotless-macos-universal.tar.gz.sha256
          generate_release_notes: true
