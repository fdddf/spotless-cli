name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The core reads macOS volume layout, the Trash, and .app bundles, so the
    # tests only mean anything on a Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (CLI crate only — spotless-core is vendored verbatim)
        run: cargo fmt -p spotless -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Smoke test
        # Every read-only command, on a runner with a real home directory.
        run: |
          ./target/release/spotless --version
          ./target/release/spotless rules --json > /dev/null
          ./target/release/spotless scan --json > /dev/null
          ./target/release/spotless du . --depth 1 --json > /dev/null
          ./target/release/spotless trash --json > /dev/null
