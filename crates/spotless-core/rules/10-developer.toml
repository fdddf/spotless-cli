# Developer-junk targets — Spotless's headline differentiator.
#
# These accumulate to many gigabytes and are all safely regenerable: build
# systems and package managers re-download or rebuild on demand.

[[target]]
id = "xcode-derived-data"
name = "Xcode DerivedData"
path = "~/Library/Developer/Xcode/DerivedData"
scope = "contents"
safety = "safe"
category = "developer"
description = "Xcode build intermediates and indexes. Rebuilt on next build."

[[target]]
id = "xcode-archives"
name = "Xcode Archives"
path = "~/Library/Developer/Xcode/Archives"
scope = "contents"
safety = "caution"
category = "developer"
description = "Archived app builds. Remove only if you don't need to re-submit."

[[target]]
id = "xcode-device-support"
name = "Xcode iOS DeviceSupport"
path = "~/Library/Developer/Xcode/iOS DeviceSupport"
scope = "contents"
safety = "caution"
category = "developer"
description = "Per-iOS-version symbol caches. Regenerated when you attach a device."

[[target]]
id = "xcode-watchos-device-support"
name = "Xcode watchOS DeviceSupport"
path = "~/Library/Developer/Xcode/watchOS DeviceSupport"
scope = "contents"
safety = "caution"
category = "developer"
description = "Per-watchOS-version symbol caches. Regenerated when you attach a device."

[[target]]
id = "xcode-tvos-device-support"
name = "Xcode tvOS DeviceSupport"
path = "~/Library/Developer/Xcode/tvOS DeviceSupport"
scope = "contents"
safety = "caution"
category = "developer"
description = "Per-tvOS-version symbol caches. Regenerated when you attach a device."

[[target]]
id = "xctest-devices"
name = "XCTest runner devices"
path = "~/Library/Developer/XCTestDevices"
scope = "contents"
safety = "caution"
category = "developer"
description = "Simulator clones Xcode spins up to run tests. Recreated on the next test run."

[[target]]
id = "xcode-dvt-downloads"
name = "Xcode downloaded components"
path = "~/Library/Developer/DVTDownloads"
scope = "contents"
safety = "caution"
category = "developer"
description = "Simulator runtimes and toolchains Xcode downloaded. Re-fetched on demand."

[[target]]
id = "xcode-products"
name = "Xcode build products"
path = "~/Library/Developer/Xcode/Products"
scope = "contents"
safety = "safe"
category = "developer"
description = "Exported build products. Rebuilt on your next build or export."

[[target]]
id = "coresimulator-devices-caches"
name = "Simulator device caches"
path = "~/Library/Developer/CoreSimulator/Caches/dyld"
scope = "contents"
safety = "safe"
category = "developer"
description = "Shared dyld caches for the simulators. Rebuilt on next launch."

[[target]]
id = "coresimulator-caches"
name = "CoreSimulator caches"
path = "~/Library/Developer/CoreSimulator/Caches"
scope = "contents"
safety = "safe"
category = "developer"
description = "Simulator runtime caches. Safe to clear."

[[target]]
id = "npm-cache"
name = "npm cache"
path = "~/.npm/_cacache"
scope = "contents"
safety = "safe"
category = "developer"
description = "npm package tarball cache. npm re-downloads as needed."

