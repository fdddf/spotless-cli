name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      # `secrets` cannot be referenced from a step's `if:`, but it can be from
      # the job's `env`, so the tap step tests this instead.
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release -p spotless --target aarch64-apple-darwin
          cargo build --release -p spotless --target x86_64-apple-darwin

      # Deliberately unsigned. Gatekeeper only checks what arrives with a
      # quarantine flag, and neither `brew install` nor `curl | sh` sets one —
      # the two ways anyone actually installs a command-line tool. Signing would
      # buy nothing but a Developer ID dependency in CI.
      - name: Make a universal binary
        # One download that runs on every Mac, rather than asking people which
        # chip they have.
        run: |
          mkdir -p dist
          lipo -create -output dist/spotless \
            target/aarch64-apple-darwin/release/spotless \
            target/x86_64-apple-darwin/release/spotless
          lipo -info dist/spotless
          dist/spotless --version

      - name: Package
        run: |
          cd dist
          tar -czf spotless-macos-universal.tar.gz spotless
          shasum -a 256 spotless-macos-universal.tar.gz > spotless-macos-universal.tar.gz.sha256
          cat spotless-macos-universal.tar.gz.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spotless-macos-universal.tar.gz
            dist/spotless-macos-universal.tar.gz.sha256
          generate_release_notes: true

      # The tap lives in another repository, which GITHUB_TOKEN cannot reach, so
      # this needs a PAT with `contents: write` on fdddf/homebrew-tap. Without
      # it the release still publishes and the formula is simply left to be
      # bumped by hand.
      - name: Update the Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sha="$(cut -d' ' -f1 < dist/spotless-macos-universal.tar.gz.sha256)"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/fdddf/homebrew-tap.git" tap

          python3 scripts/bump-formula.py tap/Formula/spotless.rb "$TAG" "$sha"

          cd tap
          if git diff --quiet; then
            echo "formula already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: spotless $TAG"
          git push
