[workspace]
resolver = "2"
members = ["crates/spotless-core", "crates/spotless"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/fdddf/spotless-cli"
authors = ["Spotless contributors"]
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
dirs = "5"
thiserror = "1"
rayon = "1"

[profile.release]
# A cleaner is a tool people run occasionally from a terminal; a small, fast
# binary matters more here than a fast build.
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
